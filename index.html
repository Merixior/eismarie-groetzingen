<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eismarie – Heutige Eiskarte</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <div class="w-full">
        <!-- Moderner, Sticky Header mit Glas-Effekt -->
        <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/80 pt-6 pb-5 px-6 text-center">
            <div class="max-w-md mx-auto">
                <div class="inline-flex items-center gap-1.5 bg-sky-500/10 text-sky-400 border border-sky-500/20 px-3 py-0.5 rounded-full text-[11px] font-bold tracking-wider uppercase mb-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
                    Tageskarte
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">🍦 Eismarie</h1>
            </div>
        </header>

        <!-- Hauptinhalt -->
        <main class="max-w-md mx-auto px-4 pt-4 pb-12">
            
            <!-- Kategorie-Filter Buttons (Horizontal scrollbar) -->
            <div id="filter-container" class="flex gap-2 overflow-x-auto no-scrollbar py-2 mb-4 px-1">
                <!-- Buttons werden dynamisch gefüllt -->
            </div>

            <div id="loading" class="text-center py-20 text-slate-500 font-medium text-sm">Lade Eiskarte...</div>
            <div id="menu-container" class="space-y-3"></div>
        </main>
    </div>

    <!-- Fußbereich -->
    <footer class="text-center text-xs text-slate-500 mt-12 space-y-3 px-6 pb-8 border-t border-slate-800/80 pt-8">
        <p>
            <a href="https://www.eismarie.de" target="_blank" class="text-sky-400 font-semibold hover:underline">Zur offiziellen Haupt-Website</a>
        </p>
        <p>&copy; Eismarie • Einfach Smartphone zücken & genießen</p>
        <p>
            <a href="https://www.eismarie.de/impressum" target="_blank" class="hover:text-slate-400 underline mr-2">Impressum</a> | 
            <a href="https://www.eismarie.de/datenschutz" target="_blank" class="hover:text-slate-400 underline ml-2">Datenschutz</a>
        </p>
        <!-- Digitale Visitenkarte -->
        <p class="pt-2 text-slate-400 font-medium tracking-wide">
            Digital Solution by <a href="https://merixior.com" target="_blank" class="text-sky-400 font-semibold hover:underline">Merixior</a>
        </p>
    </footer>

    <!-- JavaScript -->
    <script>
        const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRtH-1scMsyf7a427LrzUkEUnKlvlcUdSIhBu7WL0ha302Wm_Cr5ZYY5C8mujWuaBafIQcVYrFpZMgO/pub?gid=1429314811&single=true&output=csv";

        let allItems = [];
        let activeCategory = 'Alle';

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                
                const rows = data.split('\n').map(row => {
                    return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.replace(/^"|"$/g, '').trim());
                });

                rows.shift(); // Überschrift überspringen
                allItems = [];

                rows.forEach(row => {
                    if (row.length >= 2 && row[1] && row[1] !== "") {
                        let kategorie = row[0] || 'Sorten';
                        let sorte = row[1];
                        let beschreibung = row[2] || '';
                        let preis = row[3] || '';

                        if (preis && !preis.includes('€')) {
                            preis = preis.replace('.', ',') + ' €';
                        }

                        allItems.push({ kategorie, sorte, beschreibung, preis });
                    }
                });

                loading.style.display = 'none';
                renderFilters();
                renderMenu(activeCategory);

            } catch (error) {
                loading.innerHTML = "<p class='text-red-400 text-sm'>Fehler beim Laden der Eiskarte.</p>";
            }
        }

        function renderFilters() {
            const filterContainer = document.getElementById('filter-container');
            const categories = ['Alle', ...new Set(allItems.map(item => item.kategorie))];

            filterContainer.innerHTML = '';
            categories.exports = categories; // helper
            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === activeCategory;
                btn.className = `px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${
                    isActive 
                        ? 'bg-sky-500 text-slate-950 font-bold shadow-lg shadow-sky-500/20' 
                        : 'bg-slate-800/80 text-slate-300 border border-slate-700/60 hover:bg-slate-800 hover:text-white'
                }`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderFilters();
                    renderMenu(activeCategory);
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderMenu(category) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const filteredItems = category === 'Alle' 
                ? allItems 
                : allItems.filter(item => item.kategorie === category);

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/50 backdrop-blur-sm p-4.5 rounded-2xl border border-slate-800 flex justify-between items-center transition-all hover:border-slate-700 hover:bg-slate-800/80";
                card.innerHTML = `
                    <div class="space-y-1 pr-3">
                        <span class="text-[10px] uppercase tracking-wider font-bold text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded-md inline-block">${item.kategorie}</span>
                        <h3 class="font-bold text-white text-base leading-tight">${item.sorte}</h3>
                        ${item.beschreibung ? `<p class="text-xs text-slate-400 leading-relaxed">${item.beschreibung}</p>` : ''}
                    </div>
                    <div class="text-right shrink-0">
                        ${item.preis ? `<span class="bg-sky-500/10 text-sky-300 font-bold px-3 py-1.5 rounded-xl text-sm inline-block border border-sky-500/20">${item.preis}</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadMenu();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eismarie – Heutige Eiskarte</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <div class="w-full">
        <!-- Moderner, cleaner Header mit markantem "Seit 1924" Bezug -->
        <header class="bg-gradient-to-b from-sky-500 to-sky-600 text-white pt-10 pb-10 px-6 text-center shadow-md rounded-b-[2.5rem]">
            <div class="max-w-md mx-auto">
                <span class="inline-block bg-white/20 backdrop-blur-md px-3.5 py-1 rounded-full text-xs font-semibold tracking-wider uppercase mb-3 text-sky-50">
                    Tageskarte
                </span>
                <h1 class="text-3xl font-extrabold tracking-tight">🍦 Eismarie</h1>
                <!-- Markanter Traditionshinweis direkt unter dem Namen -->
                <div class="mt-1.5 inline-flex items-center gap-1.5 text-sky-100 font-semibold text-xs tracking-widest uppercase bg-sky-700/30 px-3 py-1 rounded-full border border-sky-400/30">
                    <span>✨</span> Tradition & Handwerkskunst seit 1924
                </div>
                <p class="text-sky-100 mt-3 text-sm font-medium opacity-90">Frisch für dich zubereitet – Entdecke unsere aktuellen Sorten</p>
            </div>
        </header>

        <!-- Hauptinhalt -->
        <main class="max-w-md mx-auto px-5 -mt-4">
            
            <!-- Kategorie-Filter Buttons -->
            <div id="filter-container" class="flex gap-2 overflow-x-auto no-scrollbar py-3 mb-2 px-1">
                <!-- Buttons werden hier per JavaScript generiert -->
            </div>

            <div id="loading" class="text-center py-20 text-slate-400 font-medium text-sm">Lade Eiskarte...</div>
            <div id="menu-container" class="space-y-3"></div>
        </main>
    </div>

    <!-- Fußbereich -->
    <footer class="text-center text-xs text-slate-400 mt-16 space-y-3 px-6 pb-8">
        <p>
            <a href="https://www.eismarie.de" target="_blank" class="text-sky-600 font-semibold hover:underline">Zur offiziellen Haupt-Website</a>
        </p>
        <p>&copy; Eismarie • Einfach Smartphone zücken & genießen</p>
        <p>
            <a href="https://www.eismarie.de/impressum" target="_blank" class="hover:text-slate-600 underline mr-2">Impressum</a> | 
            <a href="https://www.eismarie.de/datenschutz" target="_blank" class="hover:text-slate-600 underline ml-2">Datenschutz</a>
        </p>
        <!-- Deine digitale Visitenkarte -->
        <p class="pt-4 text-slate-500 font-medium tracking-wide border-t border-slate-200/60 max-w-xs mx-auto">
            Digital Solution by <a href="https://merixior.com" target="_blank" class="text-sky-600 font-semibold hover:underline">Merixior</a>
        </p>
    </footer>

    <!-- JavaScript -->
    <script>
        const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRtH-1scMsyf7a427LrzUkEUnKlvlcUdSIhBu7WL0ha302Wm_Cr5ZYY5C8mujWuaBafIQcVYrFpZMgO/pub?gid=1429314811&single=true&output=csv";

        let allItems = [];
        let activeCategory = 'Alle';

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                
                const rows = data.split('\n').map(row => {
                    return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.replace(/^"|"$/g, '').trim());
                });

                rows.shift(); // Überschrift überspringen
                allItems = [];

                rows.forEach(row => {
                    if (row.length >= 2 && row[1] && row[1] !== "") {
                        let kategorie = row[0] || 'Sorten';
                        let sorte = row[1];
                        let beschreibung = row[2] || '';
                        
                        let euroTeil = (row[3] || '').replace(/€/g, '').trim();
                        let centTeil = (row[4] || '').replace(/€/g, '').trim();
                        let preis = '';

                        if (euroTeil !== '' && euroTeil !== '0') {
                            if (centTeil.length === 1) {
                                centTeil = centTeil + '0';
                            }
                            if (centTeil === '' || centTeil === '0') {
                                centTeil = '00';
                            }
                            preis = euroTeil + ',' + centTeil + ' €';
                        }

                        allItems.push({
                            kategorie: kategorie,
                            sorte: sorte,
                            beschreibung: beschreibung,
                            preis: preis
                        });
                    }
                });

                loading.style.display = 'none';
                renderFilters();
                renderMenu(activeCategory);

            } catch (error) {
                loading.innerHTML = "<p class='text-red-500 text-sm'>Fehler beim Laden der Eiskarte.</p>";
            }
        }

        function renderFilters() {
            const filterContainer = document.getElementById('filter-container');
            const categories = ['Alle', ...new Set(allItems.map(item => item.kategorie))];

            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                const isActive = cat === activeCategory;
                btn.className = `px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all shadow-sm ${
                    isActive 
                        ? 'bg-sky-600 text-white shadow-sky-200' 
                        : 'bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100'
                }`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderFilters();
                    renderMenu(activeCategory);
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderMenu(category) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const filteredItems = category === 'Alle' 
                ? allItems 
                : allItems.filter(item => item.kategorie === category);

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center transition-all hover:shadow-md";
                card.innerHTML = `
                    <div class="space-y-1 pr-3">
                        <span class="text-[10px] uppercase tracking-wider font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-md inline-block">${item.kategorie}</span>
                        <h3 class="font-bold text-slate-900 text-base leading-tight">${item.sorte}</h3>
                        ${item.beschreibung ? `<p class="text-xs text-slate-500 leading-relaxed">${item.beschreibung}</p>` : ''}
                    </div>
                    <div class="text-right shrink-0">
                        ${item.preis ? `<span class="bg-sky-50 text-sky-700 font-bold px-3 py-1.5 rounded-xl text-sm inline-block border border-sky-100/50">${item.preis}</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadMenu();
    </script>
</body>
</html>
